# Appends the three caller-identity flags to the agent's args (ADR 0100
# decision 3).
#
# A JSON6902 `add` to `args/-`, NOT a strategic-merge patch: a container's `args`
# is an ATOMIC list, so a strategic merge that mentioned `args` would REPLACE the
# base list wholesale and silently drop --redis-url, --session-lease-k8s-namespace
# and --mock. Appending preserves them.
#
# Replace the three values with your IdP's. --oidc-audience is REQUIRED whenever
# --oidc-issuer is set: an audience-less verifier accepts tokens minted for a
# different service. --oidc-jwks-uri is optional — set it to pin the signing-key
# endpoint and skip OIDC discovery (an air-gapped or pinned-key deployment);
# leave it out to derive the endpoint from the issuer's discovery document.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --oidc-issuer=https://idp.example.com/realms/mecatl
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --oidc-audience=mecatl
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --oidc-jwks-uri=https://idp.example.com/realms/mecatl/protocol/openid-connect/certs
