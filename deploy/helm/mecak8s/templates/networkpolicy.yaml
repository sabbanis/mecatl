{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mecak8s.fullname" . }}
  labels: {{- include "mecak8s.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mecak8s.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  # The public service multiplexes gRPC and HTTP; route separation is not
  # expressible in vanilla NetworkPolicy. Operators must list its peers.
  ingress:
{{- if .Values.networkPolicy.publicFrom }}
    - from:
{{ toYaml .Values.networkPolicy.publicFrom | indent 8 }}
      ports:
        - {protocol: TCP, port: grpc}
        - {protocol: TCP, port: http}
{{- else }}
    []
{{- end }}
  # DNS is the only chart-owned egress baseline. Other destinations, including
  # HTTPS, Redis, providers, and MCP endpoints, are operator supplied.
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- if .Values.redis.local.enabled }}
    # The selector is release-scoped so another Redis workload in the namespace
    # does not inherit this chart's local dependency allowance.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - {protocol: TCP, port: 6379}
{{- end }}
{{- if .Values.networkPolicy.operatorEgress }}
{{ toYaml .Values.networkPolicy.operatorEgress | indent 4 }}
{{- end }}
{{- end }}
