suite: release-scoped Lease domain
templates:
  - templates/deployment.yaml
release:
  name: edge.blue
  namespace: shared
set:
  redis.endpoint: redis.example.internal:6379
  redis.credentialsSecret: redis-credentials
  mockProvider: true
tests:
  - it: uses the dotted Helm release name exactly once
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --session-lease-k8s-domain=edge.blue
          count: 1

  - it: ignores workload naming overrides when selecting the domain
    set:
      nameOverride: renamed
      fullnameOverride: fixed-workload
    asserts:
      - equal:
          path: metadata.name
          value: fixed-workload
      - contains:
          path: spec.template.spec.containers[0].args
          content: --session-lease-k8s-domain=edge.blue
          count: 1
