{{- if ne .Values.mode .Values.global.mecatl.mode }}{{ fail "mode and global.mecatl.mode must match" }}{{- end }}
{{- $global := .Values.global.mecatl -}}
{{- $servers := $global.mcp.servers -}}
{{- $hasOAuth := false -}}
{{- $hasDirect := false -}}
{{- range $server := $servers }}{{- if eq $server.auth.mode "oauth" }}{{ $hasOAuth = true }}{{- else if or (eq $server.auth.mode "none") (eq $server.auth.mode "staticBearer") }}{{ $hasDirect = true }}{{- end }}{{- end }}
{{- if and (eq .Values.mode "managed") $hasOAuth $hasDirect }}{{ fail "managed OAuth cannot be combined with direct auth.mode none or staticBearer; split deployments or use broker mode for every MCP route" }}{{- end }}
{{- if and (eq .Values.mode "external") (ne (default "" $global.mcp.broker.callbackURL) "") }}{{ fail "external mode cannot configure global.mecatl.mcp.broker.callbackURL; configure the independently managed broker release" }}{{- end }}
{{- if eq .Values.mode "external" }}{{- range $server := $servers }}{{- if eq $server.auth.mode "oauth" }}{{ fail (printf "external mode cannot render brokered OAuth server %q; configure it in the independently managed broker release" $server.name) }}{{- end }}{{- end }}{{- end }}
{{- if or (and $global.broker.tls.caSecret (not $global.broker.tls.caKey)) (and $global.broker.tls.caKey (not $global.broker.tls.caSecret)) }}{{ fail "global.mecatl.broker.tls.caSecret and caKey must be configured together" }}{{- end }}
{{- if eq .Values.mode "managed" }}
{{- $jwt := $global.broker.workloadJWT -}}
{{- $externalTrustCount := 0 -}}
{{- if $jwt.issuer }}{{- $externalTrustCount = add1 $externalTrustCount }}{{- end -}}
{{- if $jwt.jwksURI }}{{- $externalTrustCount = add1 $externalTrustCount }}{{- end -}}
{{- if $jwt.trustBundleSecret }}{{- $externalTrustCount = add1 $externalTrustCount }}{{- end -}}
{{- if or (not $global.broker.tls.caSecret) (not $jwt.audience) (not $jwt.lifetimeSeconds) }}{{ fail "managed mode requires global.mecatl.broker TLS CA and workloadJWT audience/lifetime" }}{{- end }}
{{- if and (gt $externalTrustCount 0) (lt $externalTrustCount 3) }}{{ fail "managed mode workload JWT external trust requires issuer, jwksURI, and trustBundleSecret together; omit all three to use Kubernetes bootstrap" }}{{- end }}
{{- if and (eq $externalTrustCount 3) (not $jwt.trustBundleKey) }}{{ fail "managed mode external workload JWT trust requires trustBundleKey" }}{{- end }}
{{- if or .Values.mecak8s.remoteBroker.address .Values.mecak8s.remoteBroker.caSecret .Values.mecak8s.remoteBroker.caKey .Values.mecak8s.remoteBroker.serverName .Values.mecak8s.remoteBroker.workloadJWT.audience (ne (int .Values.mecak8s.remoteBroker.workloadJWT.lifetimeSeconds) 600) }}{{ fail "managed mode owns mecak8s.remoteBroker; configure global.mecatl.broker instead" }}{{- end }}
{{- if or .Values.mecak8s.nameOverride .Values.mecak8s.fullnameOverride .Values.mecabroker.nameOverride .Values.mecabroker.fullnameOverride }}{{ fail "managed mode owns mecak8s and mecabroker names; nameOverride/fullnameOverride are not permitted" }}{{- end }}
{{- end }}
{{- if and (or (eq .Values.mode "managed") (eq .Values.mode "external")) .Values.mecak8s.mcp.servers }}{{ fail "mecak8s.mcp.servers is owned by global.mecatl.mcp.servers; remove the child override" }}{{- end }}
{{- if and (or (eq .Values.mode "managed") (eq .Values.mode "external")) .Values.mecak8s.mcp.broker.callbackURL }}{{ fail "mecak8s.mcp.broker is owned by global.mecatl.mcp.broker; remove the child override" }}{{- end }}
{{- if and (or (eq .Values.mode "managed") (eq .Values.mode "external")) .Values.mecabroker.mcp.servers }}{{ fail "mecabroker.mcp.servers is owned by global.mecatl.mcp.servers; remove the child override" }}{{- end }}
{{- if and (or (eq .Values.mode "managed") (eq .Values.mode "external")) .Values.mecabroker.mcp.broker.callbackURL }}{{ fail "mecabroker.mcp.broker is owned by global.mecatl.mcp.broker; remove the child override" }}{{- end }}
