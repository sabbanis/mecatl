nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/stacklok/mecatl/mecabroker
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The public listener is TLS-only. The Secret must contain the selected keys.
listener:
  publicAddress: 0.0.0.0:8443
  tls:
    secretName: mecabroker-tls
    certKey: tls.crt
    keyKey: tls.key

# Workload JWT verification protects every mecak8s gRPC call.
workloadJWT:
  issuer: ""
  jwksURI: ""
  audience: mecabroker
  # Exact subject of the sole workload allowed to own broker sessions/handles.
  subject: ""
  trustBundle:
    secretName: mecabroker-workload-jwt
    key: ca.pem
  maxJWKSStalenessSeconds: 900

callbackURL: https://broker.invalid/callback
# Legacy broker-owned profiles remain supported. New installations should use mcp.servers
# for the same brokered OAuth contract used by mecak8s.
profiles: []
mcp:
  broker:
    callbackURL: ""
  servers: []

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 1000m, memory: 512Mi}

# The public listener multiplexes TLS gRPC and browser callback routes.
service:
  port: 8443

terminationGracePeriodSeconds: 70
# Numeric seconds render into the strict process-config duration fields.
drain:
  propagationDelaySeconds: 2
  timeoutSeconds: 55
  listenerShutdownTimeoutSeconds: 5

# Every broker transport, retention, and capacity bound is explicit so an
# operator can tune a singleton without relying on unreviewable extraArgs.
transport:
  rpcDeadlineSeconds: 10
  executeDeadlineSeconds: 120
  handleIdleTimeoutSeconds: 300
  sweepIntervalSeconds: 30
  cleanupTimeoutSeconds: 10
  maxHandles: 128
  maxOwners: 128
  maxReceipts: 4096
  maxReceiptBytes: 8388608
  maxPendingControls: 1024
  maxActiveExecutes: 64

# Runtime ownership is distinct from transport handles/owners. It bounds
# ToolHive logical sessions and their pending authorization state.
runtime:
  maxLogicalSessions: 1024
  logicalRetentionSeconds: 86400
  maxPendingAuthStates: 1024

# Change after externally managed TLS, trust bundle, or OAuth Secret rotation
# to trigger a controlled singleton restart.
rollout:
  restartToken: ""

networkPolicy:
  enabled: true
  # publicFrom reaches the multiplexed TLS gRPC and callback listener.
  publicFrom: []
  # Operator-owned NetworkPolicyEgressRule entries for DNS plus concrete
  # workload JWT/JWKS, upstream OAuth, and MCP destination CIDRs/selectors.
  operatorEgress: []
