image:
  digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
listener:
  tls:
    secretName: mecabroker-tls
workloadJWT:
  issuer: https://identity.example.invalid
  jwksURI: https://identity.example.invalid/keys
  subject: system:serviceaccount:mecatl:mecak8s
callbackURL: https://broker.invalid/callback
profiles: []
mcp:
  broker:
    callbackURL: https://broker.example.invalid/oauth/complete
  servers:
    - name: github
      url: https://github.example/mcp
      auth:
        mode: oauth
        oauth:
          upstream:
            mode: oauth2
            oauth2:
              authorizationEndpoint: https://github.example/login/oauth/authorize
              tokenEndpoint: https://github.example/login/oauth/access_token
          client:
            mode: preregistered
            preregistered:
              id: broker-client
              secretKeyRef: {name: github-oauth, key: client-secret}
          scopes: [repo]
          requestRefreshToken: true
          network: {additionalOrigins: [], privateOrigins: [], maxRedirects: 0}
networkPolicy:
  publicFrom: []
  operatorEgress: []
