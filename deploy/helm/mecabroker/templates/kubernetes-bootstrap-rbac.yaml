{{- if and (include "mecabroker.kubernetesBootstrap" .) (dig "mecatl" "broker" "workloadJWT" "kubernetesBootstrap" "createRBAC" true (default dict .Values.global)) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mecabroker.kubernetesBootstrapRBACName" . }}
  labels: {{- include "mecabroker.labels" . | nindent 4 }}
rules:
  - nonResourceURLs:
      - /.well-known/openid-configuration
      - /openid/v1/jwks
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mecabroker.kubernetesBootstrapRBACName" . }}
  labels: {{- include "mecabroker.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mecabroker.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mecabroker.kubernetesBootstrapRBACName" . }}
{{- end }}
