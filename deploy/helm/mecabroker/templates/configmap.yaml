{{- if ne (default "managed" (dig "mecatl" "mode" "managed" (default dict .Values.global))) "external" }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mecabroker.fullname" . }}-config
  labels: {{- include "mecabroker.labels" . | nindent 4 }}
data:
  broker.json: |
{{ include "mecabroker.validateMCP" . }}
{{ include "mecabroker.brokerConfig" . | indent 4 }}
{{- end }}
