{{- if ne (default "managed" (dig "mecatl" "mode" "managed" (default dict .Values.global))) "external" }}
{{- include "mecabroker.validateMCP" . -}}
{{- include "mecabroker.validateImage" . -}}
{{- include "mecabroker.validateShutdownBudget" . -}}
{{- $bootstrapAPIAudience := include "mecabroker.workloadBootstrapAPIAudience" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mecabroker.fullname" . }}
  labels: {{- include "mecabroker.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Process-bound authorization and callback correlation are not transferable.
    type: Recreate
  selector:
    matchLabels: {{- include "mecabroker.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mecabroker.labels" . | nindent 8 }}
      annotations:
        checksum/broker-config: {{ include "mecabroker.brokerConfig" . | sha256sum }}
        rollout/restart-token: {{ .Values.rollout.restartToken | quote }}
    spec:
      serviceAccountName: {{ include "mecabroker.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: broker
          image: {{ if .Values.image.digest }}{{ .Values.image.repository }}@{{ .Values.image.digest }}{{ else }}{{ .Values.image.repository }}:{{ default (printf "v%s" .Chart.Version) .Values.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/mecabroker/broker.json", "--log-level={{ .Values.logging.level }}"]
          ports:
            - {name: public, containerPort: 8443}
            - {name: admin, containerPort: 8081}
          startupProbe:
            exec: {command: ["/ko-app/mecabroker", "ready"]}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["/ko-app/mecabroker", "ready"]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: ["/ko-app/mecabroker", "health"]}
            periodSeconds: 20
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec: {command: ["/ko-app/mecabroker", "drain"]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tls, mountPath: /var/run/mecabroker/tls, readOnly: true}
{{- if include "mecabroker.kubernetesBootstrap" . }}
            - {name: workload-jwt-bootstrap, mountPath: /var/run/mecabroker/workload-jwt, readOnly: true}
{{- else }}
            - {name: workload-jwt, mountPath: /var/run/mecabroker/workload-jwt, readOnly: true}
{{- end }}
            - {name: broker-config, mountPath: /etc/mecabroker, readOnly: true}
            - {name: tmp, mountPath: /tmp}
{{- range $index, $profile := .Values.profiles }}
{{- if eq $profile.auth "oauth" }}
            - {name: oauth-client-secret-{{ $index }}, mountPath: /var/run/mecabroker/oauth/{{ $index }}, readOnly: true}
{{- end }}
{{- end }}
{{- range $index, $server := (default .Values.mcp.servers (dig "mecatl" "mcp" "servers" nil (default dict .Values.global))) }}
{{- if and (eq $server.auth.mode "oauth") (eq $server.auth.oauth.client.mode "preregistered") }}
            - {name: mcp-oauth-client-secret-{{ $index }}, mountPath: /var/run/mecabroker/mcp-oauth/{{ $index }}, readOnly: true}
{{- end }}
{{- end }}
      volumes:
        - name: tls
          secret:
            secretName: {{ required "listener.tls.secretName is required" .Values.listener.tls.secretName }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.listener.tls.certKey }}, path: {{ .Values.listener.tls.certKey }}}
              - {key: {{ .Values.listener.tls.keyKey }}, path: {{ .Values.listener.tls.keyKey }}}
{{- if include "mecabroker.kubernetesBootstrap" . }}
        - name: workload-jwt-bootstrap
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - {key: ca.crt, path: ca.pem}
              - serviceAccountToken:
                  path: token
                  {{ if $bootstrapAPIAudience }}
                  audience: {{ $bootstrapAPIAudience | quote }}
                  {{ end }}
                  expirationSeconds: 600
{{- else }}
        - name: workload-jwt
          secret:
            secretName: {{ include "mecabroker.workloadTrustBundle" . }}
            defaultMode: 0440
            items:
              - {key: {{ include "mecabroker.workloadTrustBundleKey" . }}, path: {{ include "mecabroker.workloadTrustBundleKey" . }}}
{{- end }}
        - name: broker-config
          configMap:
            name: {{ include "mecabroker.fullname" . }}-config
            defaultMode: 0444
{{- range $index, $profile := .Values.profiles }}
{{- if eq $profile.auth "oauth" }}
        - name: oauth-client-secret-{{ $index }}
          secret:
            secretName: {{ required (printf "profiles[%d].oauth.clientSecret.secretName is required" $index) $profile.oauth.clientSecret.secretName }}
            defaultMode: 0440
            items:
              - {key: {{ $profile.oauth.clientSecret.key }}, path: client-secret}
{{- end }}
{{- end }}
{{- range $index, $server := (default .Values.mcp.servers (dig "mecatl" "mcp" "servers" nil (default dict .Values.global))) }}
{{- if and (eq $server.auth.mode "oauth") (eq $server.auth.oauth.client.mode "preregistered") }}
        - name: mcp-oauth-client-secret-{{ $index }}
          secret:
            secretName: {{ required (printf "mcp.servers[%d].auth.oauth.client.preregistered.secretKeyRef.name is required" $index) $server.auth.oauth.client.preregistered.secretKeyRef.name }}
            defaultMode: 0440
            items:
              - {key: {{ $server.auth.oauth.client.preregistered.secretKeyRef.key }}, path: client-secret}
{{- end }}
{{- end }}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
{{- end }}
