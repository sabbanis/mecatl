# Current yaml.v3 behaviour recorded before the goccy migration. Each entry is
# reader-labelled so later migration tests can execute the same document against
# its owning adapter without imposing a repository-wide YAML policy.
cases:
  - name: authfile-implicit-bool-api-key
    category: implicit-bool
    document: |
      providers:
        openai:
          api_key: true
    readers:
      authfile: reject
  - name: authfile-quoted-bool-api-key
    category: quoted-bool
    document: |
      providers:
        openai:
          api_key: "true"
    readers:
      authfile: accept
  - name: authfile-null-api-key
    category: "null"
    document: |
      providers:
        openai:
          api_key: null
    readers:
      authfile: reject
  - name: daemonconfig-empty-metrics-address
    category: empty
    document: |
      version: v1
      metrics_addr: ""
    readers:
      daemonconfig: accept
  - name: daemonconfig-hex-rate-burst
    category: numeric
    document: |
      version: v1
      rate_burst: 0x10
    readers:
      daemonconfig: accept
  - name: authfile-timestamp-expiry
    category: timestamp
    document: |
      providers:
        openai-codex:
          oauth:
            access_token: "token"
            account_id: "account"
            expires_at: 2026-08-28T12:00:00Z
    readers:
      authfile: accept
  - name: authfile-explicit-string-tag
    category: tag
    document: |
      providers:
        openai:
          api_key: !!str 123
    readers:
      authfile: accept
  - name: permconfig-merge-key
    category: merge
    document: |
      defaults: &defaults
        allow: [Read]
      permissions:
        <<: *defaults
    readers:
      permconfig: accept
  - name: configvalidate-anchor
    category: anchor
    document: |
      defaults: &defaults
        mode: strict
    readers:
      configvalidate: reject
  - name: configvalidate-alias
    category: alias
    document: |
      learning: *learning
    readers:
      configvalidate: reject
  - name: configvalidate-alias-through-merge
    category: alias-through-merge
    document: |
      defaults: &defaults
        learning:
          mode: strict
      <<: *defaults
    readers:
      configvalidate: reject
